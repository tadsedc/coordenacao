<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programação · INOVATEC</title><link rel="stylesheet" href="hub.css?v=1"></head><body><main class="hub"><header><a class="mark" href="/inovatec/">&lt;/&gt;</a><div><strong>INOVATEC</strong><small>PROGRAMAÇÃO DO EVENTO</small></div></header><section class="hero"><p>AGENDA</p><h1>Programação.</h1><span>Atividades, horários e locais do INOVATEC.</span></section><section id="agenda" class="cards"><div class="card">Carregando programação…</div></section></main><footer>Coordenação de TADS e EDC · AEMS</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://uvdnejmdqgwdcipctyur.supabase.co','sb_publishable_Afn5llFEgcHD4Uhmt8N4pA_W0T_NHZk');db.rpc('listar_programacao_inovatec').then(({data,error})=>{const el=document.querySelector('#agenda');if(error||!data?.length){el.innerHTML='<div class="card"><h2>Programação em breve</h2><p>A agenda do evento será divulgada pela coordenação.</p></div>';return}el.innerHTML=data.map(x=>'<article class="card agenda"><b>'+new Date(x.data_hora).toLocaleDateString('pt-BR')+'</b><h2>'+x.nome+'</h2><p><strong>Horário:</strong> '+new Date(x.data_hora).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</p><p><strong>Local:</strong> '+x.local+'</p></article>').join('')});</script></body></html>
