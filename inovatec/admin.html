<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordenação · INOVATEC</title><link rel="stylesheet" href="hub.css"></head><body><main class="hub"><header><a class="mark" href="/painel.html">&lt;/&gt;</a><div><strong>INOVATEC</strong><small>PAINEL DA COORDENAÇÃO</small></div></header><section class="hero"><p>GESTÃO DO EVENTO</p><h1>Cadastros.</h1><span>Oficinas, estudantes habilitados e programação.</span></section><section class="cards"><form id="office" class="card"><b>OFICINAS</b><h2>Nova oficina</h2><input name="titulo" placeholder="Nome da oficina" required><input name="data" type="datetime-local"><input name="local" placeholder="Local"><input name="vagas" type="number" min="1" value="30" required><textarea name="descricao" placeholder="Descrição"></textarea><button class="admin">Salvar oficina</button></form><form id="agenda" class="card"><b>PROGRAMAÇÃO</b><h2>Nova atividade</h2><input name="nome" placeholder="Nome da atividade" required><input name="data" type="datetime-local" required><input name="local" placeholder="Local" required><button class="admin">Salvar atividade</button></form><section class="card"><b>ESTUDANTES APTOS</b><h2>Importar CSV</h2><p>Colunas: nome, email e telefone.</p><input id="csv" type="file" accept=".csv"><button id="import" class="admin">Importar lista</button><p id="msg"></p></section></section></main><style>input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #cbddec;border-radius:8px;font:inherit}button.admin{margin:14px 0 0;border:0;cursor:pointer;background:#0873d1;color:#fff}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=2"></script></body></html>
