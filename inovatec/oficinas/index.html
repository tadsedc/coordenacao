<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oficinas · INOVATEC</title><link rel="stylesheet" href="../hub.css"></head><body><main class="hub"><header><a class="mark" href="/inovatec/">&lt;/&gt;</a><div><strong>INOVATEC</strong><small>OFICINAS</small></div></header><section class="hero"><p>VAGAS LIMITADAS</p><h1>Oficinas.</h1><span>Informe nome completo e e-mail exatamente como cadastrados pela coordenação.</span></section><div class="card agenda"><strong>Já se inscreveu na Semana Acadêmica?</strong><p>Se não, acesse <a href="https://inscricoes.aems.edu.br" target="_blank">inscricoes.aems.edu.br</a>, inscreva-se e aguarde a liberação do acesso.</p></div><section id="list" class="cards" style="margin-top:18px"></section></main><footer>Coordenação de TADS e EDC · AEMS</footer><dialog id="d"><form method="dialog" class="card"><button value="cancel" style="float:right">×</button><h2 id="t"></h2><input id="n" placeholder="Nome completo" required style="width:100%;padding:12px;margin:5px 0"><input id="e" type="email" placeholder="E-mail cadastrado" required style="width:100%;padding:12px;margin:5px 0"><button id="go" type="button" class="admin">Confirmar inscrição</button><p id="msg"></p></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://uvdnejmdqgwdcipctyur.supabase.co','sb_publishable_Afn5llFEgcHD4Uhmt8N4pA_W0T_NHZk'),L=document.querySelector('#list'),D=document.querySelector('#d');let selected;async function load(){let{data}=await db.rpc('listar_oficinas_inovatec');L.innerHTML=(data||[]).map(o=>`<article class="card workshop"><b>${o.vagas_disponiveis} VAGAS</b><h2>${o.titulo}</h2><p>${o.descricao||''}</p><p>${o.local||''}</p><button class="admin" onclick="openOffice(${o.id},'${o.titulo.replace(/'/g,"\\'")}')" ${o.vagas_disponiveis<1?'disabled':''}>Inscrever-me</button></article>`).join('')||'<div class="card">Oficinas em breve.</div>'}function openOffice(id,title){selected=id;document.querySelector('#t').textContent=title;document.querySelector('#msg').textContent='';D.showModal()}window.openOffice=openOffice;document.querySelector('#go').onclick=async()=>{let nome=n.value,email=e.value;let{data,error}=await db.rpc('buscar_estudante_inovatec',{p_nome:nome,p_email:email});if(error||!data?.length){msg.textContent='Nome completo e e-mail não encontrados na lista habilitada.';return}if(!confirm('Confirmar inscrição para '+data[0].nome_completo+'?'))return;let r=await db.rpc('inscrever_inovatec',{p_nome:nome,p_email:email,p_oficina_id:selected});msg.textContent=r.error?r.error.message:'Inscrição confirmada!';if(!r.error){load();setTimeout(()=>D.close(),1200)}};load()</script></body></html>
